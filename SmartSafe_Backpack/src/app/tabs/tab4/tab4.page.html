<ion-header [translucent]="true">
  <ion-toolbar class="custom-toolbar">
    <ion-title class="toolbar-title">Alertas y Notificaciones</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="presentPopover($event)">
        <ion-icon name="person-circle-outline" class="profile-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="notifications-container">

    <div class="header-section">
      <h1 class="main-title">Centro de Notificaciones</h1>
      <p class="subtitle">Alertas y recomendaciones inteligentes</p>
    </div>

    <div class="section-title">
      <ion-icon name="notifications"></ion-icon>
      <h3>Notificaciones Recientes</h3>
      <span class="notif-count" *ngIf="notifications.length > 0">{{ notifications.length }}</span>
    </div>

    <!-- Sin notificaciones -->
    <div class="empty-state" *ngIf="notifications.length === 0">
      <ion-icon name="notifications-off-outline"></ion-icon>
      <p>Sin notificaciones por ahora</p>
      <span>Las alertas aparecerán aquí automáticamente</span>
    </div>

    <!-- Lista dinámica -->
    <ion-list class="notifications-list" *ngIf="notifications.length > 0">
      <ion-item-sliding *ngFor="let notif of notifications" [attr.data-id]="notif.id" #slidingItem>

        <ion-item lines="none" class="notification-item">
          <div class="notification-card" [ngClass]="notif.type">
            <div class="notification-icon" [ngClass]="notif.iconClass">
              <ion-icon [name]="notif.icon"></ion-icon>
            </div>
            <div class="notification-content">
              <h3 class="notification-title">{{ notif.title }}</h3>
              <p class="notification-message">{{ notif.message }}</p>
              <div class="notification-footer">
                <span class="notification-time">
                  <ion-icon name="time-outline"></ion-icon>
                  {{ notif.timeText }}
                </span>
                <span class="notification-badge" [ngClass]="notif.badgeClass">{{ notif.badge }}</span>
              </div>
            </div>
          </div>
        </ion-item>

        <ion-item-options side="end">
          <ion-item-option color="danger"
            (click)="deleteNotification(notif.id, slidingItem['el'])">
            <ion-icon name="trash" slot="icon-only"></ion-icon>
          </ion-item-option>
        </ion-item-options>

      </ion-item-sliding>
    </ion-list>

  </div>

  <div class="background-effects">
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
  </div>
</ion-content>
